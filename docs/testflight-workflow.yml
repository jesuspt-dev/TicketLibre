name: Optional - Upload to TestFlight
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unique Apple build number, greater than the previous upload'
        required: true
        default: '2'
permissions:
  contents: read
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 50
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - name: Validate and test before signing
        run: |
          python3 scripts/validate.py
          bash scripts/test-ios.sh
      - name: Apply unique build number to the ephemeral checkout
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os,plistlib,pathlib
          value=os.environ['IOS_BUILD_NUMBER']
          assert value.isdigit() and int(value)>0,'Build number must be a positive integer'
          p=pathlib.Path('TicketLibre/Info.plist');v=plistlib.loads(p.read_bytes());v['CFBundleVersion']=value;p.write_bytes(plistlib.dumps(v))
          PY
      - name: Sign and upload to App Store Connect
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bash scripts/upload-testflight.sh
