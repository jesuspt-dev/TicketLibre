name: Build iPhone IPA with xtool
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
concurrency:
  group: xtool-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Expand initial source package
        if: hashFiles('TicketLibre-source.zip') != ''
        run: |
          unzip -q TicketLibre-source.zip -d /tmp/ticketlibre-source
          cp -R /tmp/ticketlibre-source/TicketLibre/. .
          rm TicketLibre-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Publish complete MIT-licensed TicketLibre source"
          git push origin HEAD:main
      - name: Select Apple SDK and Swift toolchain
        run: source scripts/select-xcode.sh
      - name: Install official xtool 1.23.0
        run: |
          mkdir -p .tooling/xtool
          curl -fL --retry 3 https://github.com/xtool-org/xtool/releases/download/1.23.0/xtool.app.zip -o .tooling/xtool/xtool.app.zip
          printf '%s\n' '89b6d87795bf62580862527230a6c175b9ea8f831cf4614a131e9781f0a43353  .tooling/xtool/xtool.app.zip' | shasum -a 256 -c -
          ditto -xk .tooling/xtool/xtool.app.zip .tooling/xtool
          echo "$PWD/.tooling/xtool/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"
      - name: Validate project and xtool configuration
        run: |
          python3 scripts/prepare-xtool.py
          python3 scripts/validate.py
          swift package dump-package > /tmp/TicketLibre-package.json
      - name: Run compiled portable core tests
        run: bash scripts/test-core.sh
      - name: Run native XCTest separately with Apple SDK
        run: bash scripts/test-ios.sh
      - name: Compile and package iPhone IPA with xtool
        run: bash scripts/build-xtool.sh
      - name: Save IPA for personal signing
        uses: actions/upload-artifact@v4
        with:
          name: TicketLibre-v1.0.1-iPhone-xtool-unsigned
          path: |
            build/TicketLibre-v1.0.1-iPhone-unsigned.ipa
            build/TicketLibre-v1.0.1-iPhone-unsigned.ipa.sha256
          retention-days: 7
      - name: Save native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-test-results
          path: build/TicketLibre-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TicketLibre-v1.0.1-iPhone-xtool-unsigned
          path: release
      - name: Publish verified unsigned IPA release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.0.1
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            exit 0
          fi
          gh release create "$RELEASE_TAG" release/* --target main --title "TicketLibre $RELEASE_TAG" --notes "Built with xtool. This IPA is unsigned and needs personal signing with AltStore. MIT licensed source. Not an App Store publication."
